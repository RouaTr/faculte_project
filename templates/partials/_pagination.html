{% if page_obj.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Pagination">
  <span>Page {{ page_obj.number }} sur {{ page_obj.paginator.num_pages }}</span>
  <div class="btn-row">
    {% if page_obj.has_previous %}<a class="btn btn-quiet btn-sm" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">Précédent</a>{% endif %}
    {% if page_obj.has_next %}<a class="btn btn-quiet btn-sm" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Suivant</a>{% endif %}
  </div>
</nav>
{% endif %}
