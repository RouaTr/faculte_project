{% if field.field.widget.input_type == "checkbox" %}
<div class="field field-check {% if field.errors %}has-error{% endif %}">
  {{ field }}
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {% for e in field.errors %}<p class="error">{{ e }}</p>{% endfor %}
</div>
{% else %}
<div class="field {% if wide %}wide{% endif %} {% if field.errors %}has-error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span aria-hidden="true"> *</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<p class="hint">{{ field.help_text }}</p>{% endif %}
  {% for e in field.errors %}<p class="error">{{ e }}</p>{% endfor %}
</div>
{% endif %}
